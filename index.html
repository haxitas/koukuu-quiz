<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>航空無線通信士 過去問</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>航空無線通信士 過去問</h1>
    <button id="home-btn" class="link-btn" hidden>← 科目選択にもどる</button>
  </header>

  <!-- 選択画面 -->
  <section id="screen-select" class="screen">
    <p class="hint">年・期を選び、科目をタップすると始まります。成績はこの端末にだけ保存されます。</p>
    <div id="search-box">
      <input type="search" id="search-input" placeholder="問題文を検索(例: 第52条から第55条)" autocomplete="off">
    </div>
    <div id="search-results" hidden></div>
    <div id="exam-list"></div>
  </section>

  <!-- よく間違える問題ランキング -->
  <section id="screen-ranking" class="screen" hidden>
    <h2 class="ranking-title">よく間違える問題</h2>
    <p class="hint">通算で間違えた回数が多い順です。タップすると正解まで表示します。</p>
    <div id="ranking-list"></div>
  </section>

  <!-- 端末間の同期 -->
  <section id="screen-sync" class="screen" hidden>
    <h2 class="ranking-title">端末間で同期</h2>
    <p class="hint">成績はサーバーに送りません。コードをコピーして、もう一方の端末に貼り付けます。取り込みは常に「合体」なので、既存の記録が消えることはありません。</p>

    <div class="sync-block">
      <h3>1. この端末のコードを渡す</h3>
      <div id="sync-export-info" class="sync-info"></div>
      <textarea id="sync-export" class="sync-text" readonly rows="4"></textarea>
      <button id="sync-copy-btn" class="primary sync-btn">コードをコピー</button>
      <div id="sync-copy-msg" class="sync-msg"></div>
    </div>

    <div class="sync-block">
      <h3>2. もう一方の端末のコードを取り込む</h3>
      <textarea id="sync-import" class="sync-text" rows="4" placeholder="ここにコードを貼り付け" autocomplete="off"></textarea>
      <button id="sync-import-btn" class="primary sync-btn">取り込む</button>
      <div id="sync-import-msg" class="sync-msg"></div>
    </div>
  </section>

  <!-- 出題画面 -->
  <section id="screen-quiz" class="screen" hidden>
    <div id="quiz-meta"></div>
    <div id="progress"></div>
    <article id="question"></article>
    <nav id="quiz-nav">
      <button id="prev-btn">← 前へ</button>
      <button id="next-btn">次へ →</button>
      <button id="grade-btn" class="primary" hidden>採点する</button>
    </nav>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen" hidden>
    <div id="result-summary"></div>
    <h2>誤答の見直し</h2>
    <div id="wrong-list"></div>
    <button id="result-home-btn" class="primary">科目選択にもどる</button>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
